[package]
name = "subs-core"
version = "0.1.0"
edition = "2021"
# [main-edition]
# One licence for the whole repository, including this crate. Never published to
# crates.io, so license-file rather than an SPDX expression — FSL has no SPDX id.
license-file = "../LICENSE"
# [/main-edition]
# [0bsd-edition]
# # One licence for the whole repository, including this crate.
# license = "0BSD"
# [/0bsd-edition]

[lib]
name = "subs_core"
# staticlib: the Swift app links this together with the sherpa-onnx archives.
# The final link happens in build.sh, not here.
crate-type = ["staticlib"]

[build-dependencies]
cbindgen = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
