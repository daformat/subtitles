<!doctype html>
<!-- The page the welcome window's webview loads. Hand-written; the demo markup is
     spliced into the placeholder further down by tools/vendor-demo.sh, and
     demo.css / demo.js come from the site untouched. Everything specific to
     being embedded in a window rather than being part of a web page lives in the
     <style> below, so that re-vendoring never has to be merged by hand.

     Do not name the placeholder in this comment: the splice is a plain string
     replacement, and a second copy of the token here is a second copy of the
     demo — injected into the head, where it ends this comment early and takes
     the stylesheet with it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtitles demo</title>
<link rel="stylesheet" href="demo.css">
<style>
  /* Transparent all the way down. The window behind this is a normal AppKit
     one and paints its own background; anything opaque here would sit on top
     of it as a white rectangle in dark mode. */
  html, body {
    margin: 0;
    background: transparent;
    font-family: var(--font);
    color: var(--text);
  }

  /* The demo sits in a page on the site, with air above it and a caption below.
     Here the window's own padding is that air, and the ⇧ line under it is drawn
     in AppKit rather than being page copy in a web view. */
  .demo { margin-top: 0; }

  /* Nothing in here scrolls: the window is sized to the content, and a webview
     that can be rubber-banded inside a window reads as a bug. */
  html, body { overflow: hidden; overscroll-behavior: none; }

  /* The screen's shadow is tuned for a page background it can fall on. Over a
     window it lands on the window's own material and reads as grime, so it is
     replaced with the hairline that frames it. */
  .demo-screen { box-shadow: none; }

  /* Each window on a layer of its own. WebKit here paints the Notes document
     into the Spotify window for a few frames at a time in the podcast scene,
     under the waveform, once the scenes have been switched by hand: the notes
     go on being written behind the player, their content is dimmed through a
     filter, and the repaint of that filtered content lands on the window over
     it, which shares the page's backing store. Filmed at 60 Hz, three such
     stretches in a minute, none in Chrome. A window that renders to its own
     layer cannot be painted into by another. */
  .demo-window { will-change: transform; }

  /* The web view is wider and taller than the demo, out into the empty
     margins round it (Welcome.swift's demoBleed: to the window's sides, and
     to the lines above and below), so the glow under the screen has room to
     fade instead of being cut at the screen's own edges. The padding puts the
     demo back where it was, 734 wide. */
  body { padding: 18px 44px 16px; }

  /* The screen's corner is 2.3vw on the site, which was 734 of viewport here
     until the padding widened it: held at what that gave. */
  .demo-screen, .demo-frame::before { border-radius: 16.88px; }

  /* The site's glow reaches about 100px past the screen, with a blur of 52px.
     The window has 44 at the sides and 18 above, so here it is tightened to
     fade out inside that: a 28px blur has all but gone (under 1%) 65px out,
     and pushed down a little further, so the top clears the 18 above as the
     bottom has the scene bar's room to fall into. */
  .demo-frame::before {
    transform: translateY(27px) scale(0.945);
    filter: blur(28px) saturate(1.6);
  }
</style>
</head>
<body>
<!--DEMO-->
<script src="demo.js"></script>
</body>
</html>
